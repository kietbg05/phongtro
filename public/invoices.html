<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hóa Đơn | Hệ Thống Quản Lý Phòng Trọ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Flatpickr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        #serviceListContainer::-webkit-scrollbar { display: none; }
        #serviceListContainer { -ms-overflow-style: none; scrollbar-width: none; overflow: visible !important; }
    </style>
</head>
<body>

    <div class="wrapper d-flex">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-home-user me-2"></i> QUẢN LÝ PHÒNG
            </div>
            <ul class="list-unstyled components">
                <li><a href="index.html"><i class="fas fa-tachometer-alt me-2"></i> Tổng quan</a></li>
                <li><a href="areas.html"><i class="fas fa-building me-2"></i> Khu trọ</a></li>
                <li><a href="rooms.html"><i class="fas fa-door-open me-2"></i> Phòng trọ</a></li>
                <li><a href="utilities.html"><i class="fas fa-bolt me-2"></i> Chốt điện nước</a></li>
                <li><a href="tenants.html"><i class="fas fa-users me-2"></i> Khách thuê</a></li>
                <li><a href="services.html"><i class="fas fa-concierge-bell me-2"></i> Dịch vụ/Phí</a></li>
                <li><a href="contracts.html"><i class="fas fa-file-contract me-2"></i> Hợp đồng</a></li>
                <li class="active"><a href="invoices.html"><i class="fas fa-file-invoice-dollar me-2"></i> Hóa đơn</a></li>
                <li><a href="login.html" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i> Đăng xuất</a></li>
            </ul>
        </nav>

        <!-- Page Content -->
        <div id="content">
            <header class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="animate-fade-in">Quản Lý Hóa Đơn</h2>
                <button class="btn btn-primary" onclick="openAddInvoiceModal()">
                    <i class="fas fa-plus me-2"></i> Lập Hóa Đơn Tháng
                </button>
            </header>

            <div class="card animate-fade-in shadow-lg border-0 mb-4">
                <!-- Bộ lọc chuyên nghiệp cho Hóa đơn -->
                <div class="px-3 py-3" style="background: linear-gradient(135deg, rgba(30,40,60,0.8), rgba(20,30,50,0.9)); border-bottom: 1px solid rgba(255,255,255,0.05);">
                    <div class="d-flex align-items-center mb-2">
                        <i class="fas fa-filter text-info me-2" style="font-size: 0.75rem;"></i>
                        <span class="text-secondary small fw-bold text-uppercase" style="letter-spacing: 1px; font-size: 0.7rem;">Bộ lọc hóa đơn</span>
                    </div>
                    <div class="row g-3 align-items-end">
                        <div class="col-md-3">
                            <label class="form-label text-secondary small mb-1"><i class="fas fa-door-open me-1"></i>Số phòng</label>
                            <input type="text" id="filterInvRoom" class="form-control bg-dark text-white border-secondary rounded-3" placeholder="Nhập số phòng..." oninput="filterInvoices()" style="border-color: rgba(255,255,255,0.1) !important;">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label text-secondary small mb-1"><i class="fas fa-calendar-alt me-1"></i>Kỳ thanh toán</label>
                            <select id="filterInvCycle" class="form-select bg-dark text-white border-secondary rounded-3" onchange="filterInvoices()" style="border-color: rgba(255,255,255,0.1) !important;">
                                <option value="">Tất cả các tháng</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label text-secondary small mb-1"><i class="fas fa-receipt me-1"></i>Trạng thái</label>
                            <select id="filterInvStatus" class="form-select bg-dark text-white border-secondary rounded-3" onchange="filterInvoices()" style="border-color: rgba(255,255,255,0.1) !important;">
                                <option value="">Tất cả trạng thái</option>
                                <option value="Chưa thanh toán">🔴 Chưa thanh toán</option>
                                <option value="Đã thanh toán">🟢 Đã thanh toán</option>
                            </select>
                        </div>
                        <div class="col-md-3 text-end">
                            <button class="btn btn-outline-info w-100 rounded-3" onclick="clearInvFilters()" style="border-color: rgba(255,255,255,0.15);">
                                <i class="fas fa-redo me-1"></i> Đặt lại
                            </button>
                        </div>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0" id="invoiceTable">
                            <thead>
                                <tr>
                                    <th>Phòng</th>
                                    <th>Kỳ Thanh Toán</th>
                                    <th>Số Tiền</th>
                                    <th>Ngày Lập</th>
                                    <th>Trạng Thái</th>
                                    <th>Hành Động</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Lập Hóa Đơn -->
    <div class="modal fade" id="addInvoiceModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">Tạo Hóa Đơn Mới</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="invoiceForm">
                        <input type="hidden" id="editInvoiceId">
                        <div class="mb-3">
                            <label class="form-label">Chọn Hợp Đồng / Phòng</label>
                            <select class="form-select bg-dark text-white border-secondary" id="selectContract" required></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ngày Lập Hóa Đơn</label>
                            <input type="text" class="form-control bg-dark text-white border-secondary datepicker" id="invoiceDate" placeholder="dd/mm/yyyy" required>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="label-small text-info">Số Điện (Cũ)</label>
                                <input type="number" class="form-control bg-dark text-white border-secondary" id="dienCu" value="0">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="label-small text-info">Số Điện (Mới)</label>
                                <input type="number" class="form-control bg-dark text-white border-secondary" id="dienMoi" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="label-small text-info">Số Nước (Cũ)</label>
                                <input type="number" class="form-control bg-dark text-white border-secondary" id="nuocCu" value="0">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="label-small text-info">Số Nước (Mới)</label>
                                <input type="number" class="form-control bg-dark text-white border-secondary" id="nuocMoi" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="label-small text-secondary">Giá Điện (đ/kWh)</label>
                                <input type="number" class="form-control bg-dark text-white border-secondary" id="giaDien" value="3500">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="label-small text-secondary">Giá Nước (đ/m3)</label>
                                <input type="number" class="form-control bg-dark text-white border-secondary" id="giaNuoc" value="15000">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-primary small fw-bold"><i class="fas fa-plus-circle me-1"></i>Dịch vụ & Phụ phí cộng thêm</label>
                            <div id="serviceListContainer" class="p-2 border border-secondary rounded bg-secondary bg-opacity-10">
                                <!-- Load từ API -->
                                <p class="text-muted small mb-0">Đang tải dịch vụ...</p>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" id="btnSubmitInvoice" onclick="submitInvoice()">Xuất Hóa Đơn</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Flatpickr -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/vn.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/confirm-modal.js"></script>
    <script>
        const API_URL = '/api';

        document.addEventListener('DOMContentLoaded', () => {
            fetchInvoices();
            loadContracts();
            fetchServices();

            flatpickr(".datepicker", {
                allowInput: true,
                dateFormat: "d/m/Y",
                locale: "vn",
                defaultDate: "today",
                monthSelectorType: "dropdown"
            });

            // Tự động load chỉ số cũ khi chọn hợp đồng
            document.getElementById('selectContract').addEventListener('change', async function() {
                const id = this.value;
                if (!id) return;
                try {
                    const res = await fetch(`${API_URL}/hopdong/${id}/last-meter`);
                    const data = await res.json();
                    document.getElementById('dienCu').value = data.dienMoi || 0;
                    document.getElementById('nuocCu').value = data.nuocMoi || 0;
                    // Reset số mới để tránh lỗi
                    document.getElementById('dienMoi').value = data.dienMoi || 0;
                    document.getElementById('nuocMoi').value = data.nuocMoi || 0;
                } catch (err) { console.error('Lỗi lấy chỉ số cũ:', err); }
            });
        });

        let allServices = [];
        async function fetchServices() {
            try {
                const res = await fetch(`${API_URL}/dichvu`);
                allServices = await res.json();
                const container = document.getElementById('serviceListContainer');
                container.innerHTML = allServices.map(s => `
                    <div class="row g-0 mx-0 align-items-center mb-2">
                        <div class="col-7 p-0">
                            <div class="form-check small">
                                <input class="form-check-input service-check" type="checkbox" value="${s.idDichVu}" id="svc_${s.idDichVu}" onchange="toggleQtyInput(${s.idDichVu})">
                                <label class="form-check-label" for="svc_${s.idDichVu}">
                                    ${s.TenDichVu} <small class="text-secondary">(${new Intl.NumberFormat('vi-VN').format(s.Gia)}đ)</small>
                                </label>
                            </div>
                        </div>
                        <div class="col-5">
                            <div class="input-group input-group-sm">
                                <span class="input-group-text bg-dark border-secondary text-white-50">SL</span>
                                <input type="number" class="form-control bg-dark text-white border-secondary service-qty" 
                                       id="qty_${s.idDichVu}" value="1" min="1" disabled>
                            </div>
                        </div>
                    </div>
                `).join('');
                if (allServices.length === 0) container.innerHTML = '<p class="text-muted small mb-0">Không có dịch vụ định nghĩa.</p>';
            } catch (err) { console.error(err); }
        }

        function toggleQtyInput(id) {
            const cb = document.getElementById(`svc_${id}`);
            const input = document.getElementById(`qty_${id}`);
            if (cb && input) input.disabled = !cb.checked;
        }

        let allInvoices = [];
        async function fetchInvoices() {
            try {
                const res = await fetch(`${API_URL}/hoadon?t=${Date.now()}`);
                if (!res.ok) throw new Error('Lỗi tải hóa đơn');
                allInvoices = await res.json();
                
                // Populate cycle filter
                const filterCycle = document.getElementById('filterInvCycle');
                if (filterCycle) {
                    const cycles = [...new Set(allInvoices.map(inv => {
                        const d = new Date(inv.ngayLap);
                        return `Tháng ${d.getMonth() + 1}/${d.getFullYear()}`;
                    }))].sort();
                    filterCycle.innerHTML = '<option value="">Tất cả các tháng</option>' + 
                        cycles.map(c => `<option value="${c}">${c}</option>`).join('');
                }

                renderInvoiceTable(allInvoices);
            } catch (error) { console.error(error); }
        }

        function filterInvoices() {
            const room = (document.getElementById('filterInvRoom')?.value || '').toLowerCase();
            const cycle = document.getElementById('filterInvCycle')?.value || '';
            const status = document.getElementById('filterInvStatus')?.value || '';

            const filtered = allInvoices.filter(inv => {
                const invCycle = `Tháng ${new Date(inv.ngayLap).getMonth() + 1}/${new Date(inv.ngayLap).getFullYear()}`;
                const matchRoom = !room || inv.SoPhong.toLowerCase().includes(room);
                const matchCycle = !cycle || invCycle === cycle;
                const matchStatus = !status || inv.trangThai === status;
                return matchRoom && matchCycle && matchStatus;
            });

            renderInvoiceTable(filtered);
        }

        function clearInvFilters() {
            if (document.getElementById('filterInvRoom')) document.getElementById('filterInvRoom').value = '';
            if (document.getElementById('filterInvCycle')) document.getElementById('filterInvCycle').value = '';
            if (document.getElementById('filterInvStatus')) document.getElementById('filterInvStatus').value = '';
            renderInvoiceTable(allInvoices);
        }

        function renderInvoiceTable(data) {
            window.currentInvoices = data; // For print/edit by index
            const tbody = document.querySelector('#invoiceTable tbody');
            if (!tbody) return;

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-secondary py-4">Không tìm thấy hóa đơn nào.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map((inv, index) => `
                <tr>
                    <td><strong>${inv.SoPhong}</strong></td>
                    <td>Tháng ${new Date(inv.ngayLap).getMonth() + 1}/${new Date(inv.ngayLap).getFullYear()}</td>
                    <td class="text-warning fw-bold">${new Intl.NumberFormat('vi-VN').format(inv.tongTien)} đ</td>
                    <td>${new Date(inv.ngayLap).toLocaleDateString('vi-VN')}</td>
                    <td>
                        <span class="badge ${inv.trangThai === 'Chưa thanh toán' ? 'bg-danger' : 'bg-success'}">
                            ${inv.trangThai}
                        </span>
                    </td>
                    <td>
                        <div class="d-flex gap-1">
                            <button class="btn btn-sm btn-outline-info" title="In" onclick="printInvoiceByIndex(${index})"><i class="fas fa-print"></i></button>
                            <button class="btn btn-sm btn-outline-warning" title="Sửa" onclick="openEditInvoiceByIndex(${index})"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-sm btn-outline-danger" title="Xóa" onclick="deleteInvoice(${inv.idHoaDon})"><i class="fas fa-trash"></i></button>
                            ${inv.trangThai === 'Chưa thanh toán' ? 
                                `<button class="btn btn-sm btn-success px-2 py-0" style="font-size: 0.75rem" onclick="payInvoice(${inv.idHoaDon})">Ghi thu</button>` : ''}
                        </div>
                    </td>
                </tr>
            `).join('');
        }


        async function loadContracts() {
            try {
                const res = await fetch(`${API_URL}/hopdong`);
                const contracts = await res.json();
                document.getElementById('selectContract').innerHTML = contracts.map(c => 
                    `<option value="${c.idHopDong}">${c.SoPhong} - ${c.HoTen}</option>`
                ).join('');
                
                // Trigger change event to load first contract's meters
                if (contracts.length > 0) document.getElementById('selectContract').dispatchEvent(new Event('change'));
            } catch (error) { console.error(error); }
        }

        async function submitInvoice() {
            const editId = document.getElementById('editInvoiceId').value;
            const dateStr = document.getElementById('invoiceDate').value;
            const parts = dateStr.split('/');
            const formattedDate = parts.length === 3 ? `${parts[2]}-${parts[1]}-${parts[0]}` : dateStr;

            const selectedServices = [];
            document.querySelectorAll('.service-check:checked').forEach(cb => {
                const service = allServices.find(s => s.idDichVu == cb.value);
                const qty = document.getElementById(`qty_${cb.value}`).value || 1;
                if (service) {
                    selectedServices.push({ ...service, customQty: Number(qty) });
                }
            });

            const data = {
                idHopDong: document.getElementById('selectContract').value,
                ngayLap: formattedDate,
                trangThai: 'Chưa thanh toán',
                dienCu: document.getElementById('dienCu').value,
                dienMoi: document.getElementById('dienMoi').value,
                giaDien: document.getElementById('giaDien').value,
                nuocCu: document.getElementById('nuocCu').value,
                nuocMoi: document.getElementById('nuocMoi').value,
                giaNuoc: document.getElementById('giaNuoc').value,
                services: selectedServices
            };

            const url = editId ? `${API_URL}/hoadon/${editId}` : `${API_URL}/hoadon`;
            const method = editId ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (res.ok) { 
                    alert(editId ? 'Đã cập nhật hóa đơn!' : 'Đã tạo hóa đơn!'); 
                    location.reload(); 
                } else {
                    alert('Lỗi: ' + (result.error || 'Không thể lưu hóa đơn.'));
                }
            } catch (error) { alert('Lỗi kết nối máy chủ!'); }
        }

        function openAddInvoiceModal() {
            document.getElementById('editInvoiceId').value = '';
            document.getElementById('invoiceForm').reset();
            
            // Tự động chọn tất cả dịch vụ
            document.querySelectorAll('.service-check').forEach(cb => {
                cb.checked = true;
                toggleQtyInput(cb.value);
            });
            
            document.querySelector('#addInvoiceModal .modal-title').innerText = 'Tạo Hóa Đơn Mới';
            document.getElementById('btnSubmitInvoice').innerText = 'Xuất Hóa Đơn';
            const modal = new bootstrap.Modal(document.getElementById('addInvoiceModal'));
            modal.show();
        }

        async function openEditInvoiceModal(inv) {
            document.getElementById('editInvoiceId').value = inv.idHoaDon;
            document.getElementById('selectContract').value = inv.idHopDong;
            
            // Format ngày để gán vào input (dd/mm/yyyy -> yyyy-mm-dd cho flatpickr)
            const d = new Date(inv.ngayLap);
            document.getElementById('invoiceDate')._flatpickr.setDate(d);

            document.getElementById('dienCu').value = inv.dienCu;
            document.getElementById('dienMoi').value = inv.dienMoi;
            document.getElementById('giaDien').value = inv.giaDien;
            document.getElementById('nuocCu').value = inv.nuocCu;
            document.getElementById('nuocMoi').value = inv.nuocMoi;
            document.getElementById('giaNuoc').value = inv.giaNuoc;

            // Load và chọn các dịch vụ đã lưu
            document.querySelectorAll('.service-check').forEach(cb => cb.checked = false);
            try {
                const svRes = await fetch(`${API_URL}/hoadon/${inv.idHoaDon}/services`);
                const savedServices = await svRes.json();
                savedServices.forEach(s => {
                    const cb = document.getElementById(`svc_${s.idDichVu}`);
                    if (cb) {
                        cb.checked = true;
                        toggleQtyInput(s.idDichVu);
                        const qtyInput = document.getElementById(`qty_${s.idDichVu}`);
                        if (qtyInput) qtyInput.value = s.soLuong;
                    }
                });
            } catch (err) { console.error('Lỗi lấy dịch vụ khi sửa:', err); }

            document.getElementById('btnSubmitInvoice').innerText = 'Cập Nhật Hóa Đơn';
            document.querySelector('#addInvoiceModal .modal-title').innerText = 'Chỉnh Sửa Hóa Đơn';
            const modal = new bootstrap.Modal(document.getElementById('addInvoiceModal'));
            modal.show();
        }

        async function deleteInvoice(id) {
            if (!id) return;
            showConfirm('Xác nhận xóa hóa đơn này?', async () => {
                const res = await fetch(`${API_URL}/hoadon/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    alert('Đã xóa hóa đơn!');
                    fetchInvoices();
                } else {
                    alert('Lỗi khi xóa hóa đơn.');
                }
            });
        }

        async function payInvoice(id) {
            if (!id) return;
            showConfirm('Xác nhận khách đã đóng tiền?', async () => {
                const res = await fetch(`${API_URL}/hoadon/${id}/pay`, { method: 'POST' });
                if (res.ok) {
                    alert('Đã ghi thu tiền thành công!');
                    fetchInvoices();
                } else {
                    alert('Lỗi ghi thu.');
                }
            });
        }

        async function printInvoiceByIndex(index) {
            const inv = window.currentInvoices[index];
            if (inv) await printInvoice(inv);
        }

        async function openEditInvoiceByIndex(index) {
            const inv = window.currentInvoices[index];
            if (inv) await openEditInvoiceModal(inv);
        }

        async function printInvoice(inv) {
            // Lấy danh sách dịch vụ đi kèm hóa đơn
            let servicesHtml = '';
            try {
                const svRes = await fetch(`${API_URL}/hoadon/${inv.idHoaDon}/services`);
                const services = await svRes.json();
                servicesHtml = services.map(s => `
                    <tr>
                        <td>${s.TenDichVu}</td>
                        <td class="text-center">${s.soLuong} ${s.DonViTinh}</td>
                        <td>${new Intl.NumberFormat('vi-VN').format(s.thanhTien / s.soLuong)} đ</td>
                        <td class="text-end">${new Intl.NumberFormat('vi-VN').format(s.thanhTien)} đ</td>
                    </tr>
                `).join('');
            } catch (err) { console.error('Lỗi lấy dịch vụ khi in:', err); }

            const printWindow = window.open('', '_blank');
            const date = new Date(inv.ngayLap);
            const formattedDate = date.toLocaleDateString('vi-VN');
            
            const moneyRoom = new Intl.NumberFormat('vi-VN').format(inv.giaThue);
            const moneyElec = new Intl.NumberFormat('vi-VN').format((inv.dienMoi - inv.dienCu) * inv.giaDien);
            const moneyWater = new Intl.NumberFormat('vi-VN').format((inv.nuocMoi - inv.nuocCu) * inv.giaNuoc);
            const moneyTotal = new Intl.NumberFormat('vi-VN').format(inv.tongTien);

            printWindow.document.write(`
                <html>
                <head>
                    <title>In Hóa Đơn - ${inv.SoPhong}</title>
                    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
                    <style>
                        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
                        body { font-family: 'Inter', sans-serif; padding: 30px; background: #fff; }
                        .receipt-box { border: 2px solid #000; padding: 40px; max-width: 800px; margin: auto; }
                        .header-title { border-bottom: 2px solid #000; padding-bottom: 15px; margin-bottom: 25px; text-align: center; }
                        .table-details { width: 100%; margin: 25px 0; border-collapse: collapse; }
                        .table-details th { background: #f8f9fa; }
                        .total-row { font-size: 24px; font-weight: 800; color: #d32f2f; margin-top: 20px; text-align: right; }
                        .signature-box { margin-top: 50px; display: flex; justify-content: space-between; text-align: center; }
                        @media print { .no-print { display: none; } body { padding: 0; } .receipt-box { border: 2px solid #000; } }
                    </style>
                </head>
                <body>
                    <div class="receipt-box">
                        <div class="header-title">
                            <h2 class="fw-bold mb-1">PHIẾU THANH TOÁN TIỀN NHÀ</h2>
                            <p class="text-primary fw-bold text-uppercase mb-0">${inv.TenKhuTro}</p>
                            <p class="text-muted small">Kỳ: Tháng ${date.getMonth() + 1}/${date.getFullYear()} | Ngày lập: ${formattedDate}</p>
                        </div>

                        <div class="row mb-4">
                            <div class="col-6">
                                <p class="mb-1">Khách thuê: <strong>${inv.HoTen}</strong></p>
                                <p class="mb-0">Phòng: <strong>${inv.SoPhong}</strong></p>
                            </div>
                            <div class="col-6 text-end text-muted small">
                                Mã hóa đơn: #HD-${inv.idHoaDon}
                            </div>
                        </div>

                        <table class="table-details">
                            <thead>
                                <tr>
                                    <th>Hạng mục</th>
                                    <th>Chỉ số</th>
                                    <th>Đơn giá</th>
                                    <th class="text-end">Thành tiền</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Tiền thuê phòng</td>
                                    <td class="text-center">-</td>
                                    <td>-</td>
                                    <td class="text-end">${moneyRoom} đ</td>
                                </tr>
                                <tr>
                                    <td>Tiền điện</td>
                                    <td>${inv.dienCu} &rarr; ${inv.dienMoi} (${inv.dienMoi - inv.dienCu} kWh)</td>
                                    <td>${new Intl.NumberFormat('vi-VN').format(inv.giaDien)} đ</td>
                                    <td class="text-end">${moneyElec} đ</td>
                                </tr>
                                <tr>
                                    <td>Tiền nước</td>
                                    <td>${inv.nuocCu} &rarr; ${inv.nuocMoi} (${inv.nuocMoi - inv.nuocCu} m3)</td>
                                    <td>${new Intl.NumberFormat('vi-VN').format(inv.giaNuoc)} đ</td>
                                    <td class="text-end">${moneyWater} đ</td>
                                </tr>
                                ${servicesHtml}
                            </tbody>
                        </table>

                        <div class="total-row">
                            TỔNG CỘNG: ${moneyTotal} VNĐ
                        </div>

                        <div class="signature-box">
                            <div style="width: 40%">
                                <p class="fw-bold">KHÁCH THUÊ</p>
                                <p class="small text-muted">(Ký và ghi rõ họ tên)</p>
                            </div>
                            <div style="width: 40%">
                                <p class="fw-bold">NGƯỜI LẬP PHIẾU</p>
                                <p class="small text-muted">(Ký và ghi rõ họ tên)</p>
                                <br><br>
                                <p class="fw-bold">HUTECH ADMIN</p>
                            </div>
                        </div>

                        <div class="mt-5 text-center no-print">
                            <button onclick="window.print()" class="btn btn-primary btn-lg px-5">IN HÓA ĐƠN</button>
                            <button onclick="window.close()" class="btn btn-outline-secondary btn-lg ms-3">Đóng</button>
                        </div>
                    </div>
                </body>
                </html>
            `);
            printWindow.document.close();
        }

        function logout() { localStorage.removeItem('user'); window.location.href = 'login.html'; }
    </script>
</body>
</html>
